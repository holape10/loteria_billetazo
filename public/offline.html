<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <title>Sin conexión - El Billetazo</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #030712; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }

<body>
    <main>
        <img src="/app-icons/icon-192.png" alt="El Billetazo">

        <button type="button" onclick="location.reload()">Reintentar</button>

</html>
